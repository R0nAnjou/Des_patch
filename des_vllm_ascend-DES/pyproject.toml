[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-ascend-des-patch"
version = "0.1.0"
description = "Out-of-tree Dynamic Expert Selection patch for vLLM Ascend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "DES contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.entry-points."vllm.general_plugins"]
vllm_ascend_des = "vllm_ascend_des:register"

[tool.setuptools]
packages = [
  "vllm_ascend_des",
  "vllm_ascend_des._310p",
  "vllm_ascend_des.tik",
]
package-dir = { vllm_ascend_des = "vllm_ascend/ops/fused_moe", "vllm_ascend_des._310p" = "vllm_ascend/_310p/fused_moe", "vllm_ascend_des.tik" = "tik" }

